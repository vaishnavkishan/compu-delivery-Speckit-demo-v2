openapi: 3.0.3
info:
  title: Bulk Hardware Order Management API
  version: "1.0.0"
  description: >
    Order intake, pricing, lifecycle, history, and cancellation for enterprise
    bulk hardware orders. No authentication: callers supply a trusted identity
    header per FR-001/FR-010/FR-012. This document is the Phase 1 design
    contract; the running service's authoritative OpenAPI document is
    generated from the controllers by springdoc-openapi (see research.md #8).
servers:
  - url: /api

components:
  parameters:
    ClientIdHeader:
      name: X-Client-Id
      in: header
      required: true
      description: Caller-supplied enterprise client identifier (trusted as-is).
      schema:
        type: string
    OperatorIdHeader:
      name: X-Operator-Id
      in: header
      required: true
      description: Caller-supplied operator identifier (trusted as-is).
      schema:
        type: string
    OperatorIdHeaderOptional:
      name: X-Operator-Id
      in: header
      required: false
      description: >
        Present only when an operator, viewing the client selected in the
        identity switcher's client/company selector, is reading that
        client's orders rather than a client reading its own (FR-026). Does
        not widen the read beyond the client named by X-Client-Id.
      schema:
        type: string
    PageQuery:
      name: page
      in: query
      required: false
      description: 0-based page number; each page holds at most 25 orders (FR-008).
      schema:
        type: integer
        minimum: 0
        default: 0
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    ProblemDetail:
      type: object
      description: RFC 7807 problem details, as produced by Spring's ProblemDetail.
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri }

    ConflictProblemDetail:
      description: >
        A 409 response for a first-committed-wins rejection (FR-016). Extends
        ProblemDetail with the order's now-current lifecycle status, re-read
        after the conflicting write lost, so the caller sees the actual
        outcome without a separate lookup.
      allOf:
        - $ref: '#/components/schemas/ProblemDetail'
        - type: object
          properties:
            currentStatus: { $ref: '#/components/schemas/OrderStatus' }
          required: [currentStatus]

    HardwareCatalogItem:
      type: object
      properties:
        sku: { type: string }
        name: { type: string }
        listPrice: { type: number, format: decimal }
      required: [sku, name, listPrice]

    DemoIdentity:
      type: object
      properties:
        id: { type: string }
        displayName: { type: string }
        role: { type: string, enum: [CLIENT, OPERATOR] }
      required: [id, displayName, role]

    LineItemInput:
      type: object
      properties:
        sku: { type: string }
        quantity:
          type: integer
          minimum: 1
          maximum: 10000
          description: Rejected above 10,000 units (FR-014).
      required: [sku, quantity]

    LineItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        sku: { type: string }
        quantity: { type: integer }
        unitListPrice: { type: number, format: decimal }
        lineSubtotal: { type: number, format: decimal }
      required: [id, sku, quantity, unitListPrice, lineSubtotal]

    OrderStatus:
      type: string
      enum: [INTAKE, PROCESSING, BACKORDERED, SHIPPED, FINAL_DELIVERY, CANCELLED]

    LifecycleTransition:
      type: object
      properties:
        fromStatus: { $ref: '#/components/schemas/OrderStatus' }
        toStatus: { $ref: '#/components/schemas/OrderStatus' }
        actorType: { type: string, enum: [CLIENT, OPERATOR, SYSTEM] }
        actorId: { type: string }
        occurredAt: { type: string, format: date-time }
      required: [toStatus, actorType, actorId, occurredAt]

    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        clientId: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        lineItems:
          type: array
          items: { $ref: '#/components/schemas/LineItem' }
        grossTotal: { type: number, format: decimal }
        appliedDiscountPercentage: { type: number, format: decimal }
        netTotal: { type: number, format: decimal }
        netTotalLocked: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        cancelledAt: { type: string, format: date-time, nullable: true }
      required: [id, clientId, status, lineItems, grossTotal, appliedDiscountPercentage, netTotal, netTotalLocked, createdAt, updatedAt]

    OrderDetail:
      allOf:
        - $ref: '#/components/schemas/Order'
        - type: object
          properties:
            transitions:
              type: array
              items: { $ref: '#/components/schemas/LifecycleTransition' }

    OrderSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/OrderStatus' }
        netTotal: { type: number, format: decimal }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, status, netTotal, createdAt, updatedAt]

    CreateOrderRequest:
      type: object
      properties:
        lineItems:
          type: array
          minItems: 1
          maxItems: 100
          description: Rejected above 100 line items (FR-030).
          items: { $ref: '#/components/schemas/LineItemInput' }
      required: [lineItems]

    ReplaceLineItemsRequest:
      type: object
      properties:
        lineItems:
          type: array
          minItems: 1
          maxItems: 100
          description: Rejected above 100 line items (FR-030).
          items: { $ref: '#/components/schemas/LineItemInput' }
      required: [lineItems]

    AdvanceStatusRequest:
      type: object
      properties:
        targetStatus: { $ref: '#/components/schemas/OrderStatus' }
      required: [targetStatus]

    OrderHistoryPage:
      description: >
        A bounded, newest-first page of the caller's own orders (FR-008).
        `hasMore` tells the frontend whether to render the "reach older
        entries" control without a separate count call.
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderSummary' }
        page: { type: integer, minimum: 0 }
        pageSize: { type: integer, enum: [25] }
        totalCount: { type: integer }
        hasMore: { type: boolean }
      required: [items, page, pageSize, totalCount, hasMore]

paths:
  /demo-identities:
    get:
      summary: List selectable demo client/operator identities (FR-019)
      operationId: listDemoIdentities
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DemoIdentity' }

  /catalog:
    get:
      summary: List fixed Hardware Catalog Items (FR-020)
      operationId: listCatalogItems
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/HardwareCatalogItem' }

  /orders:
    post:
      summary: Submit a bulk hardware order (FR-001–FR-004, FR-014, FR-015, FR-030)
      operationId: createOrder
      parameters:
        - $ref: '#/components/parameters/ClientIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
      responses:
        '201':
          description: Order created in Intake status with calculated Net Total.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDetail' }
        '400':
          description: >
            Invalid line items — zero/negative quantity, quantity above
            10,000, unknown SKU, empty order, or more than 100 line items
            (FR-014, FR-015, FR-030); no order is created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '422':
          description: >
            Client's contract discount terms are missing, ambiguous, or
            expired (FR-004) — including a discount percentage not strictly
            between 0% and 100%. No BulkOrder or LineItem row is created for
            this rejection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
    get:
      summary: >
        View own order history, newest-first, paged at 25 entries (FR-008,
        FR-009). An operator may pass X-Operator-Id alongside X-Client-Id to
        view the selected client's history instead (FR-026).
      operationId: listOrders
      parameters:
        - $ref: '#/components/parameters/ClientIdHeader'
        - $ref: '#/components/parameters/OperatorIdHeaderOptional'
        - $ref: '#/components/parameters/PageQuery'
      responses:
        '200':
          description: OK — one newest-first page of only the named client's orders.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderHistoryPage' }

  /orders/{orderId}:
    get:
      summary: >
        View own order detail (FR-008, FR-009, FR-018). An operator may pass
        X-Operator-Id alongside X-Client-Id to view the selected client's
        order instead (FR-026).
      operationId: getOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/ClientIdHeader'
        - $ref: '#/components/parameters/OperatorIdHeaderOptional'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDetail' }
        '404':
          description: >
            Generic not-found — returned identically whether the order does
            not exist or belongs to a different client (FR-018).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /orders/{orderId}/line-items:
    put:
      summary: >
        Replace an order's line items while it is Intake or Processing;
        recalculates Gross Total and Net Total using currently effective
        contract terms (FR-025, FR-014, FR-030).
      operationId: replaceOrderLineItems
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/ClientIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceLineItemsRequest' }
      responses:
        '200':
          description: Line items replaced; Gross Total and Net Total recalculated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDetail' }
        '400':
          description: >
            Invalid line items — zero/negative quantity, quantity above
            10,000, unknown SKU, empty list, or more than 100 line items
            (FR-014, FR-030); the order's existing line items and totals are
            left unchanged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '422':
          description: >
            Client's contract discount terms are missing, ambiguous, or
            expired at the moment of the edit (FR-004, FR-025); the order's
            existing line items and last-valid totals are left unchanged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404':
          description: Generic not-found (FR-018).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '409':
          description: >
            Order is no longer editable (past Processing) or was concurrently
            modified — in the latter case the body includes the order's
            now-current status (FR-016, FR-017, FR-025).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConflictProblemDetail' }

  /orders/{orderId}/cancel:
    post:
      summary: Cancel an own Active order (FR-010, FR-011, FR-016, FR-018)
      operationId: cancelOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/ClientIdHeader'
      responses:
        '200':
          description: Order cancelled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDetail' }
        '404':
          description: Generic not-found (FR-018).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '409':
          description: >
            Order already at Final Delivery, already Cancelled, or lost a
            first-committed-wins race against another change; the body
            includes the order's now-current status (FR-011, FR-016).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConflictProblemDetail' }

  /orders/{orderId}/status:
    post:
      summary: Advance an order's lifecycle status (FR-005, FR-006, FR-012, operator-only)
      operationId: advanceOrderStatus
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/OperatorIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdvanceStatusRequest' }
      responses:
        '200':
          description: Status advanced; transition recorded (FR-007).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDetail' }
        '404':
          description: Order not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '409':
          description: >
            Requested transition is not a valid next step (skip, backward
            move, or transition from a terminal state), or lost a
            first-committed-wins race; the body includes the order's
            now-current status (FR-006, FR-016).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConflictProblemDetail' }
